# Runs the offline tests. The integration tests need a SAP system and skip themselves here.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # lets the publish workflow run the tests before releasing
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test]"
      - run: pytest

  # GitHub's runners no longer provide these old versions, so they run in the official images
  test-old-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9"]
    container: python:${{ matrix.python-version }}-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install ".[test]"
      - run: pytest
